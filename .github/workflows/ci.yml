name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail on high or critical advisories in code that ships to the browser.
      # Dev-only tooling advisories are handled by Dependabot PRs instead of blocking merges.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
